AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Transit Gateway que conecta tres VPCs.

  Recupera los datos de las VPCs creadas en el stack 15VPCsParaTransitGateway para crear los attachments 
  y las rutas necesarias. Utiliza para ello las exportaciones de los IDs de VPC, Subnets y Route Tables.

  Solo funciona con las VPCs dentro de la misma región y si los stacks de las VPCs se han creado con 
  el mismo nombre que el indicado en los parámetros (Stack1Name, Stack2Name y Stack3Name).

    Utilizado CloudFormation para AWS Academy Learning Lab
    Autor: Javier Teran Gonzalez
    Fecha creacion:     16/03/2026
    
  Version: 1.0
  Modificaciones: 16/03/2026.
Parameters:
  Stack1Name:
    Type: String
    Default: marte
  Stack2Name:
    Type: String
    Default: urano
  Stack3Name:
    Type: String
    Default: jupiter

Resources:
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: TGW para conectar VPCs
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tgw'

  # Attachment para VPC 1 (incluye Public y Private Subnets)
  TGWAttachment1:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: 
        Fn::ImportValue: !Sub '${Stack1Name}-VPC-ID'
      SubnetIds:
        - Fn::ImportValue: !Sub '${Stack1Name}-PrivateSubnet1-ID'
        - Fn::ImportValue: !Sub '${Stack1Name}-PrivateSubnet2-ID'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tgw-attachment-${Stack1Name}'


  # Attachment para VPC 2 (incluye Public y Private Subnets)
  TGWAttachment2:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: 
        Fn::ImportValue: !Sub '${Stack2Name}-VPC-ID'
      SubnetIds:
        - Fn::ImportValue: !Sub '${Stack2Name}-PrivateSubnet1-ID'        
        - Fn::ImportValue: !Sub '${Stack2Name}-PrivateSubnet2-ID'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tgw-attachment-${Stack2Name}'
  
  # Attachment para VPC 3 (incluye Public y Private Subnets)
  TGWAttachment3:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: 
        Fn::ImportValue: !Sub '${Stack3Name}-VPC-ID'
      SubnetIds:
        - Fn::ImportValue: !Sub '${Stack3Name}-PrivateSubnet1-ID'        
        - Fn::ImportValue: !Sub '${Stack3Name}-PrivateSubnet2-ID'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-tgw-attachment-${Stack3Name}'
  # =============================================
  # RUTAS A TRANSIT GATEWAY (10.0.0.0/8)
  # =============================================
  
  # Ruta en tabla pública Stack1
  RouteVPC1Public:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment1
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack1Name}-PublicRouteTable-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 1 Stack1
  RouteVPC1Private1:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment1
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack1Name}-PrivateRouteTable1-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 2 Stack1
  RouteVPC1Private2:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment1
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack1Name}-PrivateRouteTable2-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla pública Stack2
  RouteVPC2Public:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment2
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack2Name}-PublicRouteTable-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 1 Stack2
  RouteVPC2Private1:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment2
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack2Name}-PrivateRouteTable1-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 2 Stack2
  RouteVPC2Private2:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment2
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack2Name}-PrivateRouteTable2-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

# Ruta en tabla pública Stack3
  RouteVPC3Public:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment3
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack3Name}-PublicRouteTable-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 1 Stack3
  RouteVPC3Private1:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment3
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack3Name}-PrivateRouteTable1-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  # Ruta en tabla privada 2 Stack3
  RouteVPC3Private2:
    Type: AWS::EC2::Route
    DependsOn: TGWAttachment3
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub '${Stack3Name}-PrivateRouteTable2-ID'
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway
Outputs:
  TransitGatewayId:
    Value: !Ref TransitGateway
    Export:
      Name: TransitGateway-ID